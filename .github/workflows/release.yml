name: Build & Release

permissions:
  contents: write

on:
  push:
    branches: [main, layers]
  pull_request:
    branches: [main]

jobs:
  build-and-upload:
    name: Build and Upload to Tigris
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          bun install
          bun install --include=optional sharp
          bun install --os=darwin --cpu=arm64 sharp
          bun install --os=win32 --cpu=x64 sharp
          bun install --os=linux --cpu=x64 sharp

      - name: Build Clones Quality Agent for All Operating Systems
        run: bun run build

      - name: Fix Build Permissions
        run: chmod -R +r target/

      - name: Package binaries with dependencies
        run: |
          mkdir -p target/packaged
          
          # For each binary, create a package with node_modules
          for binary in target/clones-quality-agent-*; do
            if [ -f "$binary" ]; then
              basename_file=$(basename "$binary")
              package_dir="target/packaged/${basename_file}-package"
              mkdir -p "$package_dir"
              
              # Copy binary with versioned name
              version=$(jq -r .version package.json)
              if [[ "$basename_file" == *"win"* ]]; then
                versioned_binary_name="${basename_file}-v${version}.exe"
              else
                versioned_binary_name="${basename_file}-v${version}"
              fi
              cp "$binary" "$package_dir/$versioned_binary_name"
              
              # Copy Sharp and Canvas with their dependencies for the specific platform
              mkdir -p "$package_dir/node_modules"
              if [[ "$basename_file" == *"macos"* ]] || [[ "$basename_file" == *"linux"* ]] || [[ "$basename_file" == *"win"* ]]; then
                echo "Copying Sharp and its dependencies..."
                
                # Core Sharp dependencies
                for dep in sharp detect-libc semver @img; do
                  if [ -d "node_modules/$dep" ]; then
                    echo "Copying $dep..."
                    cp -r "node_modules/$dep" "$package_dir/node_modules/" || true
                  fi
                done
                
                # Canvas and its potential dependencies if available
                for dep in canvas; do
                  if [ -d "node_modules/$dep" ]; then
                    echo "Copying $dep..."
                    cp -r "node_modules/$dep" "$package_dir/node_modules/" || true
                  fi
                done
                
                echo "Package dependencies copied successfully"
              fi
              
              # Create archive (go into the package directory to avoid nested structure)
              cd "target/packaged/${basename_file}-package"
              if [[ "$basename_file" == *"win"* ]]; then
                zip -r "../${basename_file}-package.zip" .
              else
                tar -czf "../${basename_file}-package.tar.gz" .
              fi
              cd ../../..
            fi
          done

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Upload directly to Tigris
        run: |
          # Convert Windows line endings to Unix
          sed -i 's/\r$//' scripts/upload_to_tigris.sh
          chmod +x scripts/upload_to_tigris.sh
          echo "=== Debug: target directory structure ==="
          ls -la target/
          bash scripts/upload_to_tigris.sh
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
