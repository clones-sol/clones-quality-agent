name: Build & Release

permissions:
  contents: write

on:
  push:
    branches: [main, layers]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install
      - name: Build Clones Quality Agent for All Operating Systems
        run: bun run build

      - name: Fix Artifact Permissions
        run: chmod -R +r target/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          path: target/
          compression-level: 0

  upload-to-tigris:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Prepare target directory
        run: |
          mkdir -p target
          cp -r artifacts/artifact/* target/

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Upload to Tigris
        run: ./scripts/upload_to_tigris.sh
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
